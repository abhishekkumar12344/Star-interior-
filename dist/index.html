<style>
:root {
  --navy: #071C35;
  --navy-2: #0C2A4E;
  --navy-3: #102E55;
  --navy-deep: #041224;
  --gold: #C49A45;
  --gold-2: #E8C87E;
  --gold-dark: #9A782E;
  --ivory: #F7F3EA;
  --ivory-2: #EFE7D6;
  --white: #ffffff;
  --dark: #14202F;
  --muted: #68768B;
  --muted-light: #A9B4C4;
  --line: rgba(196, 154, 69, 0.32);
  --line-soft: rgba(196, 154, 69, 0.16);
  --shadow: 0 20px 60px rgba(7, 28, 53, 0.14);
  --shadow-gold: 0 18px 50px rgba(196, 154, 69, 0.28);
  --radius: 18px;
  --radius-sm: 12px;
  --font-display: 'Playfair Display', Georgia, serif;
  --font-body: 'Jost', system-ui, sans-serif;
  --font-script: 'Great Vibes', cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  background: var(--ivory);
  color: var(--dark);
  line-height: 1.7;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
::selection { background: var(--gold); color: var(--navy); }
::-webkit-scrollbar { width: 11px; }
::-webkit-scrollbar-track { background: var(--ivory); }
::-webkit-scrollbar-thumb { background: linear-gradient(var(--gold), var(--navy)); border-radius: 20px; }

/* Preloader */
.preloader {
  position: fixed; inset: 0; background: var(--navy); z-index: 9999;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
  transition: opacity .6s, visibility .6s;
}
.preloader.hide { opacity: 0; visibility: hidden; }
.loader-mark {
  width: 72px; height: 72px; border: 1px solid var(--line); border-radius: 50%;
  display: grid; place-items: center; position: relative;
}
.loader-mark::after {
  content: ''; position: absolute; inset: -8px;
  border: 1px solid transparent; border-top-color: var(--gold); border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loader-mark span { font-family: var(--font-display); color: var(--gold); font-size: 32px; }
.preloader p { color: #fff; letter-spacing: .35em; font-size: 11px; text-transform: uppercase; }

/* Topbar */
.topbar { background: var(--navy-deep); color: #D8DEE8; font-size: 13px; letter-spacing: .02em; padding: 8px 0; position: relative; z-index: 60; }
.topbar-inner { max-width: 1280px; margin: auto; padding: 0 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.topbar-left, .topbar-right { display: flex; gap: 22px; align-items: center; }
.topbar a { display: flex; align-items: center; gap: 8px; opacity: .9; transition: .3s; }
.topbar a:hover { color: var(--gold-2); }
.topbar svg { width: 14px; height: 14px; fill: var(--gold); }

/* Navbar */
.navbar {
  position: sticky; top: 0; z-index: 100;
  background: var(--navy);
  border-bottom: 1px solid var(--line);
  transition: .4s;
}
.navbar.scrolled {
  background: rgba(7, 28, 53, 0.98);
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
}
.nav-inner {
  max-width: 1280px; margin: auto; padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 20px;
}
.brand { display: flex; align-items: center; gap: 13px; }
.brand-badge {
  width: 52px; height: 52px; background: var(--navy); border: 1px solid var(--gold);
  border-radius: 12px; display: grid; place-items: center; position: relative; flex-shrink: 0;
}
.brand-badge::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 6px; height: 2px; background: var(--gold); }
.brand-badge svg { width: 30px; height: 30px; fill: var(--gold-2); }
.brand-text h2 { font-family: var(--font-display); font-size: 23px; letter-spacing: .12em; color: #fff; line-height: 1; }
.brand-text h2 span { color: var(--gold-2); }
.brand-text small { display: block; font-size: 10.5px; letter-spacing: .28em; color: var(--gold); margin-top: 3px; font-weight: 500; }

nav.main-nav { display: flex; align-items: center; gap: 28px; }
.nav-link {
  font-size: 14.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 500;
  color: #D8DEE8; position: relative; padding: 6px 0; transition: .3s; background: none; border: none;
}
.nav-link::after { content: ''; position: absolute; left: 0; bottom: 0; width: 0; height: 2px; background: var(--gold); transition: .35s; }
.nav-link:hover::after, .nav-link.active::after { width: 100%; }
.nav-link:hover { color: var(--gold-2); }
.nav-link.active { color: var(--gold-2) !important; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  padding: 14px 30px; border-radius: 100px; font-size: 14px; letter-spacing: .1em;
  text-transform: uppercase; font-weight: 600; border: 1px solid transparent;
  transition: .35s; position: relative; overflow: hidden; cursor: pointer;
}
.btn-gold {
  background: linear-gradient(135deg, var(--gold) 0%, #DDB45E 50%, var(--gold) 100%);
  color: var(--navy); box-shadow: var(--shadow-gold);
}
.btn-gold:hover { transform: translateY(-2px); box-shadow: 0 22px 50px rgba(196, 154, 69, .4); }
.btn-outline { border-color: rgba(255, 255, 255, .5); color: #fff; background: rgba(255, 255, 255, .08); backdrop-filter: blur(6px); }
.btn-outline:hover { background: #fff; color: var(--navy); border-color: #fff; }
.btn-navy { background: var(--navy); color: #fff; }
.btn-navy:hover { background: var(--navy-2); transform: translateY(-2px); }
.btn-light-gold { border-color: var(--gold); color: var(--navy); background: transparent; }
.btn-light-gold:hover { background: var(--navy); color: var(--gold-2); border-color: var(--navy); }
.btn-sm { padding: 11px 24px; font-size: 13px; }

/* Hamburger */
.hamburger {
  display: none; background: transparent; border: 1px solid var(--gold);
  width: 46px; height: 46px; border-radius: 12px; flex-direction: column;
  gap: 5px; align-items: center; justify-content: center; cursor: pointer;
}
.hamburger span { width: 22px; height: 2px; background: var(--gold-2); display: block; transition: .3s; }
.hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* Mobile drawer */
.mobile-drawer {
  position: fixed; top: 0; right: -100%; width: min(380px, 90vw); height: 100dvh;
  background: var(--navy); z-index: 200; padding: 28px;
  transition: .45s cubic-bezier(.7, 0, .3, 1); display: flex; flex-direction: column; gap: 8px;
  border-left: 1px solid var(--line);
}
.mobile-drawer.open { right: 0; }
.drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.drawer-head h3 { color: #fff; font-family: var(--font-display); letter-spacing: .15em; }
.drawer-close { background: transparent; border: 1px solid var(--line); color: var(--gold-2); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
.m-link {
  color: #D9E0EC; padding: 14px 16px; border-radius: 12px; font-size: 15px;
  letter-spacing: .08em; text-transform: uppercase; border: 1px solid transparent;
  transition: .3s; display: flex; justify-content: space-between; align-items: center;
  cursor: pointer; background: none;
}
.m-link:hover, .m-link.active { background: rgba(196, 154, 69, .12); border-color: var(--line); color: var(--gold-2); }
.drawer-foot { margin-top: auto; border-top: 1px solid rgba(255, 255, 255, .1); padding-top: 18px; color: #9FB0C6; font-size: 14px; }
.overlay {
  position: fixed; inset: 0; background: rgba(4, 18, 36, .6); backdrop-filter: blur(3px);
  opacity: 0; visibility: hidden; transition: .4s; z-index: 150;
}
.overlay.show { opacity: 1; visibility: visible; }

/* Container */
.container { max-width: 1280px; margin: auto; padding: 0 28px; }

/* Hero */
.hero {
  min-height: 100svh; display: flex; align-items: center; color: #fff;
  overflow: hidden; background: var(--navy); position: relative;
}
.hero-slides { position: absolute; inset: 0; }
.hero-slide {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  opacity: 0; transition: opacity 1.8s ease, transform 2.4s ease; transform: scale(1.05);
}
.hero-slide.active { opacity: 1; transform: scale(1); }
.hero-slide::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(95deg, rgba(4, 18, 36, .92) 0%, rgba(7, 28, 53, .78) 38%, rgba(7, 28, 53, .35) 70%, rgba(7, 28, 53, .55) 100%),
              linear-gradient(to top, rgba(4, 18, 36, .85), transparent 45%);
}
.hero-gold-line { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(var(--gold-2), var(--gold-dark)); z-index: 2; }
.hero-content { position: relative; z-index: 3; width: 100%; padding: 90px 0 130px; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line);
  background: rgba(196, 154, 69, .12); backdrop-filter: blur(8px);
  padding: 9px 18px; border-radius: 100px; font-size: 12.5px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--gold-2);
}
.hero-badge i { width: 8px; height: 8px; background: var(--gold-2); border-radius: 50%; box-shadow: 0 0 12px var(--gold-2); animation: pulse 2s infinite; display: inline-block; }
@keyframes pulse { 50% { opacity: .4; } }
.hero h1 { font-family: var(--font-display); font-size: clamp(42px, 6.2vw, 84px); line-height: 1.04; margin: 22px 0 18px; font-weight: 700; max-width: 760px; }
.hero h1 .gold {
  color: transparent; background: linear-gradient(120deg, #F3D98B, var(--gold) 60%, #F3D98B);
  -webkit-background-clip: text; background-clip: text; font-style: italic;
}
.hero .sub { max-width: 560px; color: #CBD4E2; font-size: 18px; font-weight: 300; line-height: 1.7; }
.hero-cta { display: flex; gap: 16px; margin-top: 32px; flex-wrap: wrap; }
.hero-meta {
  display: flex; gap: 0; margin-top: 48px; border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 16px; overflow: hidden; background: rgba(255, 255, 255, .06);
  backdrop-filter: blur(10px); max-width: 760px;
}
.hm-item { flex: 1; padding: 18px 22px; border-right: 1px solid rgba(255, 255, 255, .12); }
.hm-item:last-child { border: none; }
.hm-item strong { font-family: var(--font-display); font-size: 26px; color: var(--gold-2); display: block; line-height: 1; }
.hm-item span { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #B9C4D6; }
.hero-side { position: absolute; right: 48px; bottom: 36px; z-index: 3; display: flex; gap: 12px; align-items: center; }
.hero-dot { width: 44px; height: 4px; border-radius: 10px; background: rgba(255, 255, 255, .25); transition: .4s; border: none; padding: 0; cursor: pointer; }
.hero-dot.active { background: var(--gold); width: 64px; }
.scroll-hint {
  position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 3;
  color: rgba(255, 255, 255, .7); font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.scroll-hint::after {
  content: ''; width: 1px; height: 42px;
  background: linear-gradient(var(--gold), transparent); animation: drop 1.8s infinite;
}
@keyframes drop {
  0% { transform: scaleY(0); transform-origin: top; }
  50% { transform: scaleY(1); transform-origin: top; }
  51% { transform-origin: bottom; }
  100% { transform: scaleY(0); transform-origin: bottom; }
}

/* Section commons */
.sec { padding: 105px 0; }
.sec-ivory { background: var(--ivory); }
.sec-white { background: #fff; }
.eyebrow {
  display: flex; align-items: center; gap: 14px; justify-content: center;
  color: var(--gold-dark); font-size: 13px; letter-spacing: .32em;
  text-transform: uppercase; font-weight: 600; margin-bottom: 14px;
}
.eyebrow::before, .eyebrow::after { content: ''; width: 46px; height: 1px; background: var(--gold); }
.eyebrow.left { justify-content: flex-start; }
.eyebrow.left::before { display: none; }
.sec-title {
  font-family: var(--font-display); font-size: clamp(30px, 4vw, 50px);
  line-height: 1.15; color: var(--navy); text-align: center; max-width: 760px; margin: 0 auto;
}
.sec-title.left { text-align: left; margin: 0; }
.sec-title em { color: var(--gold-dark); font-style: italic; }
.sec-sub { text-align: center; color: var(--muted); max-width: 640px; margin: 16px auto 0; font-size: 17px; font-weight: 300; }
.sec-sub.left { text-align: left; margin-left: 0; }

/* About */
.about-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 64px; align-items: center; margin-top: 56px; }
.about-media { position: relative; }
.about-media .main-img { border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); border: 1px solid var(--line-soft); }
.about-media .main-img img { height: 540px; width: 100%; object-fit: cover; transition: 1s; }
.about-media:hover .main-img img { transform: scale(1.05); }
.about-media .small-img { position: absolute; right: -22px; bottom: -28px; width: 46%; border: 6px solid var(--ivory); border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); }
.about-media .small-img img { height: 210px; width: 100%; object-fit: cover; }
.exp-badge { position: absolute; left: -18px; top: 28px; background: var(--navy); color: #fff; border: 1px solid var(--gold); border-radius: 16px; padding: 16px 20px; text-align: center; box-shadow: var(--shadow); }
.exp-badge strong { font-family: var(--font-display); font-size: 36px; color: var(--gold-2); line-height: 1; display: block; }
.exp-badge span { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #C9D2E0; }
.about-copy p { color: #4A576C; font-size: 17px; font-weight: 300; margin: 16px 0; }
.about-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 22px 0; }
.about-list div { display: flex; gap: 10px; align-items: center; background: #fff; border: 1px solid var(--line-soft); padding: 12px 14px; border-radius: 12px; font-size: 14.5px; font-weight: 500; color: var(--navy); }
.about-list svg { width: 20px; height: 20px; fill: var(--gold-dark); flex-shrink: 0; }
.director-quote { border-left: 3px solid var(--gold); background: #fff; padding: 18px 20px; border-radius: 0 14px 14px 0; margin: 22px 0; box-shadow: 0 10px 30px rgba(0, 0, 0, .06); }
.director-quote p { font-family: var(--font-display); font-style: italic; font-size: 17px; color: var(--navy); margin: 0; }
.director-quote cite { font-style: normal; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-dark); }
.stats-row {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 38px;
  background: var(--navy); border-radius: 18px; padding: 26px 22px; border: 1px solid var(--gold);
  position: relative; overflow: hidden;
}
.stats-row::before { content: ''; position: absolute; inset: 0; background: radial-gradient(500px 200px at 20% 0%, rgba(196, 154, 69, .22), transparent); }
.stat { text-align: center; color: #fff; position: relative; }
.stat strong { font-family: var(--font-display); font-size: 34px; color: var(--gold-2); display: block; }
.stat span { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #BCC7D8; }

/* Services */
.services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 54px; }
.svc {
  background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid #E9E1CC;
  transition: .45s; position: relative; display: flex; flex-direction: column; cursor: pointer;
}
.svc:hover { transform: translateY(-10px); box-shadow: var(--shadow); border-color: var(--gold); }
.svc-img { height: 220px; overflow: hidden; position: relative; }
.svc-img img { width: 100%; height: 100%; object-fit: cover; transition: .8s; }
.svc:hover .svc-img img { transform: scale(1.1); }
.svc-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(7, 28, 53, .55), transparent 60%); }
.svc-cat { position: absolute; top: 14px; left: 14px; z-index: 2; background: rgba(7, 28, 53, .85); color: var(--gold-2); border: 1px solid var(--line); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; padding: 6px 12px; border-radius: 100px; backdrop-filter: blur(6px); }
.svc-icon {
  width: 58px; height: 58px; border-radius: 16px; background: var(--navy); border: 1px solid var(--gold);
  display: grid; place-items: center; margin: -29px 0 0 24px; position: relative; z-index: 2;
  box-shadow: 0 10px 24px rgba(7, 28, 53, .3);
}
.svc-icon svg { width: 28px; height: 28px; fill: none; stroke: var(--gold-2); stroke-width: 1.6; }
.svc-body { padding: 18px 24px 24px; }
.svc-body h3 { font-family: var(--font-display); font-size: 22px; color: var(--navy); margin-bottom: 8px; }
.svc-body p { color: var(--muted); font-size: 15px; font-weight: 300; }
.svc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 16px; border-top: 1px dashed #E4D9BE; }
.svc-foot button { background: none; border: none; color: var(--gold-dark); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; display: flex; gap: 8px; align-items: center; transition: .3s; cursor: pointer; }
.svc-foot button:hover { gap: 14px; }
.svc-price { font-size: 13px; color: var(--muted); }

/* Projects */
.filter-bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 36px 0 30px; }
.filter-btn {
  padding: 11px 22px; border-radius: 100px; border: 1px solid #D9CDAE; background: #fff;
  color: var(--navy); font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
  font-weight: 600; transition: .3s; cursor: pointer;
}
.filter-btn:hover { border-color: var(--gold); }
.filter-btn.active { background: var(--navy); color: var(--gold-2); border-color: var(--navy); }
.projects-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
.proj {
  border-radius: 18px; overflow: hidden; background: var(--navy); position: relative;
  cursor: pointer; border: 1px solid rgba(196, 154, 69, .25); transition: .45s;
}
.proj:hover { transform: translateY(-8px); box-shadow: var(--shadow); }
.proj-img { height: 360px; overflow: hidden; position: relative; }
.proj-img img { width: 100%; height: 100%; object-fit: cover; transition: .8s; }
.proj:hover .proj-img img { transform: scale(1.12); }
.proj-img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, rgba(4, 18, 36, .92) 8%, transparent 55%); }
.proj-badge { position: absolute; top: 12px; left: 12px; background: var(--gold); color: var(--navy); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; padding: 6px 12px; border-radius: 100px; z-index: 2; }
.proj-info { position: absolute; bottom: 0; left: 0; right: 0; padding: 18px; z-index: 2; color: #fff; }
.proj-info h3 { font-family: var(--font-display); font-size: 20px; }
.proj-info p { font-size: 13px; color: #C6D0DE; letter-spacing: .06em; }
.proj-hover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7, 28, 53, .45); opacity: 0; transition: .4s; z-index: 3; }
.proj:hover .proj-hover { opacity: 1; }
.proj-hover span { width: 62px; height: 62px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: var(--navy); font-size: 22px; transform: scale(.6); transition: .4s; }
.proj:hover .proj-hover span { transform: scale(1); }
.view-all { text-align: center; margin-top: 36px; }

/* Why */
.why { background: radial-gradient(1000px 500px at 50% -10%, #14365E 0%, var(--navy) 60%), var(--navy); color: #fff; overflow: hidden; }
.why::before {
  content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(196, 154, 69, .07) 1px, transparent 1px), linear-gradient(90deg, rgba(196, 154, 69, .07) 1px, transparent 1px);
  background-size: 56px 56px;
  -webkit-mask-image: radial-gradient(700px 400px at 50% 30%, black, transparent);
  mask-image: radial-gradient(700px 400px at 50% 30%, black, transparent);
}
.why .sec-title { color: #fff; }
.why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-top: 50px; position: relative; z-index: 2; }
.why-card {
  background: rgba(255, 255, 255, .06); border: 1px solid rgba(196, 154, 69, .35);
  border-radius: 18px; padding: 30px 22px; text-align: center; backdrop-filter: blur(8px); transition: .4s;

.float-wa {

.crumb {

}

.value-card p { color: var(--muted); font-size: 15px; font-weight: 300; }
.team-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; margin-top: 44px; }
.team-card { background: #fff; border-radius: 20px; overflow: hidden; border: 1px solid #E9E1CC; text-align: center; transition: .4s; }

.team-card img { height: 360px; width: 100%; object-fit: cover; }
.team-card .t-body { padding: 22px; }

.team-card p { color: var(--muted); font-size: 14px; margin-top: 8px; font-weight: 300; }

/* Estimator */
.estimator {
  background: var(--navy); border-radius: 22px; padding: 44px; color: #fff;
  border: 1px solid var(--gold); display: grid; grid-template-columns: 1fr 1fr; gap: 36px;
  margin-top: 50px; position: relative; overflow: hidden;
}
.estimator::after { content: '₹'; position: absolute; right: -10px; bottom: -40px; font-family: var(--font-display); font-size: 260px; opacity: .05; line-height: 1; }
.est-control { margin-bottom: 20px; }
.est-control label { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-2); margin-bottom: 10px; }
input[type=range] { width: 100%; accent-color: var(--gold); height: 28px; }
.est-pills { display: flex; gap: 10px; flex-wrap: wrap; }
.est-pill { padding: 10px 18px; border-radius: 100px; border: 1px solid rgba(196, 154, 69, .5); background: transparent; color: #fff; font-size: 13px; letter-spacing: .06em; transition: .3s; cursor: pointer; }
.est-pill:hover { border-color: var(--gold); }
.est-pill.active { background: var(--gold); color: var(--navy); font-weight: 700; }
.est-result { background: rgba(255, 255, 255, .06); border: 1px solid rgba(196, 154, 69, .4); border-radius: 18px; padding: 30px; text-align: center; align-self: center; }
.est-result strong { font-family: var(--font-display); font-size: 46px; color: var(--gold-2); display: block; }
.est-result span { font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: #9FB0C6; }

/* FAQ */
.faq { max-width: 820px; margin: 36px auto 0; display: flex; flex-direction: column; gap: 12px; }

}
.faq-q span:last-child { width: 32px; height: 32px; border-radius: 50%; background: var(--ivory); border: 1px solid var(--gold); display: grid; place-items: center; flex-shrink: 0; transition: .3s; }

.faq-a { max-height: 0; overflow: hidden; transition: .45s; color: var(--muted); font-weight: 300; }
.faq-item.open .faq-a { max-height: 200px; }
.faq-a p { padding: 0 22px 20px; }

/* Consult */
.consult-layout { display: grid; grid-template-columns: .9fr 1.1fr; gap: 28px; margin-top: 44px; align-items: start; }
.consult-side { background: var(--navy); color: #fff; border-radius: 20px; padding: 36px; border: 1px solid var(--gold); }

.steps-card { background: #fff; border-radius: 20px; padding: 36px; border: 1px solid #E9E1CC; box-shadow: var(--shadow); }
.progress-bar { display: flex; gap: 8px; margin-bottom: 26px; }

.progress-bar span.on { background: linear-gradient(90deg, var(--gold), var(--gold-2)); }

.slot { padding: 12px; border-radius: 12px; border: 1px solid #D9CDAE; background: var(--ivory); font-size: 14px; transition: .3s; text-align: center; cursor: pointer; }
.slot:hover { border-color: var(--gold); }
.slot.sel { background: var(--navy); color: var(--gold-2); border-color: var(--navy); }

/* Modal */
.modal-overlay {

  padding: 20px; visibility: hidden; opacity: 0; transition: .4s;
}
.modal-overlay.show { visibility: visible; opacity: 1; }
.modal-bg { position: absolute; inset: 0; background: rgba(4, 18, 36, .75); backdrop-filter: blur(6px); }
.modal-box {
  position: relative; background: #fff; border-radius: 22px; max-width: 640px; width: 100%;
  overflow: hidden; transform: translateY(20px) scale(.98); transition: .4s;
  border: 1px solid var(--gold); max-height: 90vh; overflow-y: auto;
}
.modal-overlay.show .modal-box { transform: none; }
.modal-box img.top { height: 260px; width: 100%; object-fit: cover; }
.modal-body { padding: 30px 32px; }
.modal-body h3 { font-family: var(--font-display); font-size: 28px; color: var(--navy); }
.modal-close { position: absolute; top: 14px; right: 14px; width: 42px; height: 42px; border-radius: 50%; background: var(--navy); color: var(--gold-2); border: 1px solid var(--gold); font-size: 18px; z-index: 2; cursor: pointer; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--navy); color: #fff; border: 1px solid var(--gold); padding: 14px 24px;
  border-radius: 100px; z-index: 500; transition: .45s; display: flex; gap: 10px;
  align-items: center; box-shadow: var(--shadow); font-size: 14.5px; max-width: 90vw;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast i { width: 28px; height: 28px; border-radius: 50%; background: var(--gold); display: grid; place-items: center; color: var(--navy); font-style: normal; flex-shrink: 0; }

/* Reveal */
.reveal { opacity: 0; transform: translateY(28px); transition: .8s cubic-bezier(.2, .7, .3, 1); }
.reveal.visible { opacity: 1; transform: none; }
.reveal-d1 { transition-delay: .1s; }
.reveal-d2 { transition-delay: .2s; }
.reveal-d3 { transition-delay: .3s; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
.page-enter { animation: fadeUp .6s ease; }

/* Responsive */
@media (max-width: 1080px) {
  nav.main-nav { display: none; }
  .hamburger { display: flex; }
  .topbar { display: none; }
  .services-grid { grid-template-columns: repeat(2, 1fr); }
  .projects-grid { grid-template-columns: repeat(2, 1fr); }
  .why-grid { grid-template-columns: repeat(2, 1fr); }
  .process-track { grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .process-track::before { display: none; }
  .about-grid, .contact-grid, .consult-layout, .cta-box, .estimator { grid-template-columns: 1fr; }
  .foot-grid { grid-template-columns: 1fr 1fr; }
  .values-grid, .team-grid { grid-template-columns: repeat(2, 1fr); }

}
@media (max-width: 640px) {
  .container, .nav-inner { padding-left: 18px; padding-right: 18px; }
  .sec { padding: 72px 0; }
  .hero { min-height: 92svh; }
  .hero-meta { flex-direction: column; }
  .hm-item { border-right: none; border-bottom: 1px solid rgba(255, 255, 255, .12); }
  .services-grid, .projects-grid, .why-grid, .values-grid, .team-grid { grid-template-columns: 1fr; }
  .process-track { grid-template-columns: 1fr 1fr; }
  .f-row { grid-template-columns: 1fr; }
  .testi { grid-template-columns: 1fr; text-align: center; padding: 30px 24px; }

  .cta-box { padding: 32px 24px; }
  .cta-phone strong { font-size: 22px; }

  .stats-row { grid-template-columns: 1fr 1fr; gap: 20px; }
  .trust-strip { grid-template-columns: 1fr 1fr; }

  .form-card, .steps-card { padding: 24px 20px; }
  .estimator { padding: 28px 22px; }
  .slot-grid { grid-template-columns: 1fr 1fr; }
  .cta-phone { flex-direction: column; text-align: center; }
}

:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

const { useState, useEffect, useRef, useCallback, createContext, useContext } = React;

// ===== ROUTER CONTEXT =====
const RouterContext = createContext();

function Router({children}) {
  const [route, setRoute] = useState(window.location.hash.slice(1) || '/');
  
  useEffect(() => {
    const handler = () => setRoute(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', handler);
    return () => window.removeEventListener('hashchange', handler);
  }, []);
  
  const navigate = useCallback((path) => {
    window.location.hash = path;
    window.scrollTo({top: 0, behavior: 'smooth'});
  }, []);
  
  return (
    <RouterContext.Provider value={{route, navigate}}>
      {children}
    </RouterContext.Provider>
  );
}

function useRouter() { return useContext(RouterContext); }

// ===== COUNTER HOOK =====
function useCounter(target, duration = 2000, start = false) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    if (!start) return;
    let startTime = null;
    const animate = (timestamp) => {
      if (!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime) / duration, 1);
      setCount(Math.floor(progress * target));
      if (progress < 1) requestAnimationFrame(animate);
    };
    requestAnimationFrame(animate);
  }, [start, target, duration]);
  return count;
}

// ===== REVEAL HOOK =====
function useReveal() {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const observer = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) setVisible(true); },
      { threshold: 0.15 }
    );
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, []);
  return [ref, visible];
}

function Reveal({children, className = '', delay = ''}) {
  const [ref, visible] = useReveal();
  return <div ref={ref} className={`reveal ${delay} ${visible ? 'visible' : ''} ${className}`}>{children}</div>;
}

function Counter({target, suffix = ''}) {

function Estimator() {

  const estimate = Math.round(area * rate * mult / 100000 * 10) / 10;
  
  return (
    <Reveal>

        <div>
          <div className="eyebrow left" style={{color:'var(--gold-2)'}}>Instant Estimator</div>

          <div className="est-control">
            <label>Scope</label>
            <div className="est-pills">

              ))}
            </div>
          </div>
          <div className="est-control">
            <label>Property Type</label>
            <div className="est-pills">
              {[{label:'2/3 BHK Home',mult:1},{label:'Villa / Bungalow',mult:1.25},{label:'Office / Retail',mult:1.15}].map(t => (
                <button key={t.label} className={`est-pill ${mult === t.mult ? 'active' : ''}`} onClick={() => setMult(t.mult)}>{t.label}</button>

                {step === 1 && (
                  <div className="step-pane on">
                    <h3 style={{fontFamily:'var(--font-display)',fontSize:'24px',color:'var(--navy)'}}>1 • What are we designing?</h3>
                    <div className="f-group" style={{marginTop:'14px'}}>
                      <label>Project Type</label>
                      <div className="est-pills" style={{marginTop:'6px'}}>
                        {['Full Home','Villa','Office','Retail / Cafe','Kitchen Only'].map((t, i) => (
                          <button key={t} type="button" className={`est-pill ${i === 0 ? 'active' : ''}`} style={{color:'var(--navy)',borderColor:'#D9CDAE'}} onClick={e => { e.target.parentElement.querySelectorAll('.est-pill').forEach(p => p.classList.remove('active')); e.target.classList.add('active'); }}>{t}</button>
                        ))}
                      </div>
                    </div>
                    <div className="f-row">
                      <div className="f-group"><label>City *</label><input name="city" placeholder="e.g. Patna" required/></div>
                      <div className="f-group"><label>Size (sq.ft) *</label><input name="size" inputMode="numeric" placeholder="e.g. 1200" required/></div>
                    </div>
                    <div className="f-group">
                      <label>Budget Range</label>
                      <select name="budget"><option>₹3 – ₹6 Lakh</option><option>₹6 – ₹12 Lakh</option><option selected>₹12 – ₹25 Lakh</option><option>₹25 Lakh+</option></select>
                    </div>
                    <button type="button" className="btn btn-navy" style={{width:'100%'}} onClick={() => setStep(2)}>Continue →</button>
                  </div>
                )}
                {step === 2 && (
                  <div className="step-pane on">
                    <h3 style={{fontFamily:'var(--font-display)',fontSize:'24px',color:'var(--navy)'}}>2 • Pick your slot</h3>
                    <p style={{color:'var(--muted)',fontSize:'14px'}}>Free visit — online or at your site.</p>
                    <div className="f-group" style={{marginTop:'12px'}}>
                      <label>Preferred Date</label>
                      <div className="slot-grid">
                        {dates.map(d => (
                          <button type="button" key={d} className={`slot ${selectedDate === d ? 'sel' : ''}`} onClick={() => setSelectedDate(d)}>{d}</button>
                        ))}
                      </div>
                    </div>
                    <div className="f-group">
                      <label>Preferred Time</label>
                      <div className="slot-grid">
                        {times.map(t => (
                          <button type="button" key={t} className={`slot ${selectedTime === t ? 'sel' : ''}`} onClick={() => setSelectedTime(t)}>{t}</button>
                        ))}
                      </div>
                    </div>
                    <div style={{display:'flex',gap:'10px'}}>
                      <button type="button" className="btn btn-light-gold" style={{flex:'1'}} onClick={() => setStep(1)}>← Back</button>
                      <button type="button" className="btn btn-navy" style={{flex:'2'}} onClick={() => setStep(3)}>Continue →</button>
                    </div>
                  </div>
                )}
                {step === 3 && (
                  <div className="step-pane on">
                    <h3 style={{fontFamily:'var(--font-display)',fontSize:'24px',color:'var(--navy)'}}>3 • Your details</h3>
                    <div className="f-row" style={{marginTop:'12px'}}>
                      <div className="f-group"><label>Name *</label><input name="name" placeholder="Full name" required/></div>
                      <div className="f-group"><label>Phone *</label><input name="phone" inputMode="numeric" placeholder="10-digit mobile" required/></div>
                    </div>
                    <div className="f-group"><label>Email</label><input name="email" type="email" placeholder="you@email.com"/></div>
                    <div className="f-group"><label>Anything we should know?</label><textarea name="note" style={{minHeight:'80px'}} placeholder="Floor, possession date, style you love..."></textarea></div>
                    <div style={{display:'flex',gap:'10px'}}>
                      <button type="button" className="btn btn-light-gold" style={{flex:'1'}} onClick={() => setStep(2)}>← Back</button>
                      <button type="submit" className="btn btn-gold" style={{flex:'2'}}>Confirm Booking ✓</button>
                    </div>
                  </div>
                )}
                {step === 4 && (
                  <div className="step-pane on" style={{textAlign:'center',padding:'20px 0'}}>
                    <div style={{width:'84px',height:'84px',borderRadius:'50%',background:'#E8F5E9',border:'2px solid #4CAF50',display:'grid',placeItems:'center',margin:'0 auto 16px',fontSize:'36px',color:'#2E7D32'}}>✓</div>
                    <h3 style={{fontFamily:'var(--font-display)',fontSize:'28px',color:'var(--navy)'}}>Booking Confirmed!</h3>
                    <p style={{color:'var(--muted)'}}>We'll call you shortly to confirm your {selectedTime} slot{selectedDate ? ` on ${selectedDate}` : ''}.</p>
                    <div style={{display:'flex',gap:'10px',justifyContent:'center',marginTop:'18px',flexWrap:'wrap'}}>
                      <a href="https://wa.me/916207283158" target="_blank" rel="noopener" className="btn btn-navy btn-sm">Chat on WhatsApp</a>
                      <a href="#/projects" className="btn btn-light-gold btn-sm">Browse Projects</a>
                    </div>
                  </div>
                )}
              </form>
            </div>
          </div>
        </div>
      </section>
      {toast && <div className="toast show"><i>✓</i><span>Consultation booked! Our designer will call you shortly.</span></div>}
    </div>
  );
}

// ===== APP =====
function App() {
  const {route} = useRouter();
  const [loading, setLoading] = useState(true);
  const [showTop, setShowTop] = useState(false);
  
  useEffect(() => {
    const timer = setTimeout(() => setLoading(false), 1500);
    return () => clearTimeout(timer);
  }, []);
  
  useEffect(() => {
    const handler = () => setShowTop(window.scrollY > 400);
    window.addEventListener('scroll', handler);
    return () => window.removeEventListener('scroll', handler);
  }, []);
  
  const renderPage = () => {
    if (route.startsWith('/project/')) {
      const id = route.split('/project/')[1];
      return <ProjectDetailsPage projectId={id}/>;
    }
    switch(route) {
      case '/about': return <AboutPage/>;
      case '/services': return <ServicesPage/>;
      case '/projects': return <ProjectsPage/>;
      case '/process': return <ProcessPage/>;
      case '/contact': return <ContactPage/>;
      case '/consultation': return <ConsultationPage/>;
      default: return <HomePage/>;
    }
  };
  
  return (
    <>
      <div className={`preloader ${!loading ? 'hide' : ''}`}>
        <div className="loader-mark"><span>S</span></div>
        <p>Skystar Interiors</p>
      </div>
      <Navbar/>
      <main>{renderPage()}</main>
      <Footer/>
      <a className="float-wa" href="https://wa.me/916207283158?text=Hi%20Skystar!%20I%20want%20a%20free%20design%20consultation." target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.4-.7-2.9-1.2-4.7-4.1-4.9-4.3-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5s.8 1.9.8 2c.1.1.1.3 0 .5-.3.6-.6.8-.4 1.1.7 1.2 1.6 2 2.8 2.6.3.2.5.1.7-.1l.8-.9c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3 0 .1 0 .7-.1 1.4z"/></svg>
      </a>
      <button className={`float-top ${showTop ? 'show' : ''}`} onClick={() => window.scrollTo({top:0,behavior:'smooth'})} aria-label="Back to top">↑</button>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Router><App/></Router>
);
</script>
</body>
</html>
